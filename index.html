<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Abfahrten MaintalMobil</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; font-size: 1.5rem; color: #005a9c; border-bottom: 2px solid #005a9c; padding-bottom: 8px; }
        .station-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; color: #555; }
        .departure-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 1.1rem; }
        .departure-row:last-child { border-bottom: none; }
        .line { background: #005a9c; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }
        .direction { flex-grow: 1; margin-left: 12px; font-weight: 500; }
        .time { font-weight: bold; color: #e67e22; }
        .error { color: #c0392b; font-weight: bold; background: #fdeae8; padding: 12px; border-radius: 6px; margin-top: 20px; font-size: 0.95rem; line-height: 1.4; }
        .loading { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="station">Abfahrtstafel</h1>
    <div id="station-name" class="station-name">MaintalMobil lädt ÖPNV-Daten...</div>
    <div id="board">
        <div class="loading">Abfahrten werden live abgerufen...</div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const stationId = urlParams.get('id');

    const board = document.getElementById('board');
    const stationNameDiv = document.getElementById('station-name');

    if (!stationId) {
        board.innerHTML = '<div class="error"><b>Fehler:</b> Keine Haltestellen-ID im QR-Code gefunden! Bitte teste einen Code aus deiner Google-Tabelle.</div>';
        stationNameDiv.textContent = "ID fehlt";
    } else {
        // Wir nutzen den freien HAFAS-Proxy für RMV-Daten (Sicher vor IP-Sperren)
        const openTransitUrl = `https://transport.rest{stationId}/departures?duration=60&results=15`;

        fetch(openTransitUrl)
            .then(res => {
                if (!res.ok) throw new Error(`Netzwerk meldet Status ${res.status}`);
                return res.json();
            })
            .then(data => {
                // Bei dieser API liegen die Abfahrten direkt im Haupt-Array oder unter data.departures
                const departures = data.departures || data;

                if (!departures || departures.length === 0) {
                    board.innerHTML = '<div class="error">Aktuell keine Abfahrten für diese Haltestelle verfügbar.</div>';
                    stationNameDiv.textContent = "Keine Fahrten";
                    return;
                }

                // Haltestellenname aus der ersten Abfahrt setzen
                if (departures[0] && departures[0].stop) {
                    stationNameDiv.textContent = departures[0].stop.name;
                } else {
                    stationNameDiv.textContent = "Abfahrtstafel";
                }

                // Abfahrtstabelle generieren
                let html = '';
                departures.forEach(dep => {
                    // Uhrzeit aus dem ISO-Zeitstempel herausschneiden (z.B. "2023-10-20T14:30:00" -> "14:30")
                    let zeit = "--:--";
                    if (dep.when) {
                        zeit = dep.when.substring(11, 16);
                    } else if (dep.plannedWhen) {
                        zeit = dep.plannedWhen.substring(11, 16);
                    }
                    
                    const linienName = dep.line?.name || "Bus";
                    const richtung = dep.direction || "Richtung unbekannt";

                    html += `
                        <div class="departure-row">
                            <span class="line">${linienName}</span>
                            <span class="direction">${richtung}</span>
                            <span class="time">${zeit} Uhr</span>
                        </div>
                    `;
                });
                board.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                board.innerHTML = `<div class="error"><b>Abfrage-Fehler:</b><br>${err.message}<br>Bitte überprüfe, ob die Haltestellen-ID im RMV-Format vorliegt.</div>`;
                stationNameDiv.textContent = "Verbindungsfehler";
            });
    }
</script>
</body>
</html>
